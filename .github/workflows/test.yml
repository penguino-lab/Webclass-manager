name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run extension tests
        run: npm test
  first-run-library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test library first run and update notices
        run: node tests/library-first-run-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-first-run-screenshots
          path: ../tmp/webclass-library-first-run/run-*/*.png
          if-no-files-found: ignore
          retention-days: 7
